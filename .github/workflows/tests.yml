name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-cov

      # These tests use synthetic schemas/configs (tests/test_*.py) and
      # never shell out to Docker/OpenLane/ORFS -- so CI validates the
      # orchestration logic (KB engine, physical_profile, sweep config,
      # sanitization) on every push without needing a PDK or a multi-GB
      # tool install. Full-flow validation against a real OpenLane/ORFS
      # checkout is a separate, manual step -- see VALIDATION.md.
      - name: Run test suite
        run: pytest tests/ -v --cov=wakeel --cov-report=term-missing

      - name: Syntax-check all Python entrypoints
        run: python -m py_compile wakeel_api.py wakeel_core.py cli_run.py dry_run.py wakeel/*.py
